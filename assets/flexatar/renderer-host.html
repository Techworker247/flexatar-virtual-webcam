<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808}canvas{width:100%;height:100%;display:block}</style>
</head>
<body>
<canvas id="flexatarCanvas"></canvas>
<script type="module">
  const canvas = document.getElementById('flexatarCanvas');
  const engineFilesUrl = 'file:///android_asset/flexatar';
  let renderer = null;
  let ready = false;
  let frameStartedAt = performance.now();
  let frameCount = 0;

  const emit = (type, detail = {}) => {
    const event = JSON.stringify({ type, ...detail });
    document.title = `flexatar:${type}`;
    window.FlexatarNative?.event(event);
  };

  function publishFrame() {
    if (!ready) return;
    frameCount += 1;
    const now = performance.now();
    const elapsed = Math.max(now - frameStartedAt, 1);
    const fps = (frameCount * 1000) / elapsed;
    emit('frame', {
      width: canvas.width,
      height: canvas.height,
      timestampNs: Math.round(now * 1000000),
      fps
    });
    requestAnimationFrame(publishFrame);
  }

  async function start() {
    emit('starting');
    try {
      const SDK = await import('./easy-renderer.js');
      renderer = new SDK.FtarRenderer(engineFilesUrl, canvas);
      await renderer.readyPromise;
      renderer.size = { width: 720, height: 720 };
      renderer.slot1 = `${engineFilesUrl}/default_ftar.p`;
      renderer.background = `${engineFilesUrl}/backgrounds/1.jpg`;
      ready = true;
      frameStartedAt = performance.now();
      frameCount = 0;
      emit('ready', { engineFilesUrl, localRenderer: true, width: 720, height: 720 });
      requestAnimationFrame(publishFrame);
    } catch (error) {
      emit('error', { message: String(error?.stack || error) });
    }
  }

  window.flexatarNativeCommand = async (command, rawPayload) => {
    try {
      const payload = JSON.parse(rawPayload || '{}');
      if (command === 'resize' && renderer) {
        renderer.size = { width: Number(payload.width) || 720, height: Number(payload.height) || 720 };
        emit('resized', { width: renderer.size.width, height: renderer.size.height });
      } else if (command === 'setAvatar' && renderer && payload.asset) {
        renderer.slot1 = payload.asset;
        emit('avatarChanged', { asset: payload.asset });
      } else if (command === 'audioPcm' && renderer && ready && payload.base64) {
        const binary = atob(payload.base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        renderer.vCamStream?.port?.postMessage({ audioBuffer: bytes.buffer }, [bytes.buffer]);
      }
    } catch (error) {
      emit('command-error', { message: String(error) });
    }
  };

  start();
</script>
</body>
</html>
